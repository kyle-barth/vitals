name: Release

# Pushing a version tag builds the exe here, from that exact source, and publishes
# it. Building on GitHub rather than a personal PC means the download can be traced
# back to the code, and contains no local file paths.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # Pinned to a commit, because a tag can be moved. This is v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy
          rustup default 1.95.0

      - name: Check the tag matches Cargo.toml
        id: version
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$' |
            Select-Object -First 1).Matches.Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/vitals.exe dist/
          $hash = (Get-FileHash dist/vitals.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  vitals.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii

          $pattern = "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|\z)"
          $changes = [regex]::Match((Get-Content CHANGELOG.md -Raw), $pattern).Groups[1].Value.Trim()
          if (-not $changes) { throw "CHANGELOG.md has no section for $env:VERSION" }

          @"
          $changes

          ## Download

          Download ``vitals.exe`` below and run it. There is nothing to install.

          The exe is not code-signed, so Windows SmartScreen may warn you the first time. Choose **More info**, then **Run anyway**.

          SHA-256: ``$hash``
          "@ -replace '(?m)^ {10}', '' | Set-Content notes.md -Encoding utf8

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          gh release create $env:GITHUB_REF_NAME
          dist/vitals.exe dist/SHA256SUMS.txt
          --repo $env:GITHUB_REPOSITORY
          --title "Vitals $env:VERSION"
          --notes-file notes.md
          --verify-tag
